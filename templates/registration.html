{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<form class="form" action="/" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <input class="input" type="text" name="username" placeholder="Username" required>
    <input class="input" type="email" name="email" placeholder="Gmail" required>
    <input class="input" type="password" name="password" placeholder="Password" required>

    <input class="input" type="file" name="photo">

    <input class="input" type="text" name="phone" placeholder="Phone">

    <textarea class="input" name="about" placeholder="about me"></textarea>

    <button class="button" type="submit">Зарегистрироваться</button>
    <a class="auth-link" href="/login/">Уже есть аккаунт? Войти</a>
</form>
