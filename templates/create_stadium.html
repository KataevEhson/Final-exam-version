{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta charset="UTF-8">
    <title>Добавить стадион</title>
</head>
<body class="page">
    <h1 class="title">Добавить стадион</h1>

<form class="form" action="/add" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <input class="input" type="text" name="caption"
           placeholder="Название поля" required>

    <input class="input" type="text" name="location"
           placeholder="Адрес" required>

    <select class="input" name="category" required>


        {% for i in categories %}
            <option value="{{ i.id }}"> {{ i.title }} </option>
        {% endfor %}
    </select>

    <input class="input" type="number" name="price" placeholder="Price" required>

    <input class="input" type="file" name="image" required>

    <button class="button" type="submit">Создать</button>
</form>
</body>
</html>
